<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessor Prototype</title>
</head>
<body>
  <main class="layout">
      <section class="stage">
    <div id="status">loading…</div>
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <footer class="statusbar" id="statusbar">
      <span class="sb-item"><span class="sb-label">latency</span><span id="sb-latency">—</span></span>
      <span class="sb-item"><span class="sb-label">pose</span><span id="sb-pose-ms">—</span></span>
      <span class="sb-item"><span class="sb-label">hands</span><span id="sb-hand-ms">—</span></span>
      <span class="sb-item"><span class="sb-label">points</span><span id="sb-points">—</span></span>
      <span class="sb-item"><span class="sb-label">fps</span><span id="sb-fps">—</span></span>
    </footer>
  </section>

    <aside class="panel">
      <fieldset class="task" data-task="feed">
        <legend>Video feed</legend>
        <label>Brightness
            <input type="range" id="feed-brightness" min="0" max="2" step="0.05" value="1" />
            <output id="feed-brightness-out">1.00</output>
        </label>
        <label>Contrast
            <input type="range" id="feed-contrast" min="0" max="2" step="0.05" value="1" />
            <output id="feed-contrast-out">1.00</output>
        </label>
        <label>Saturation
            <input type="range" id="feed-saturation" min="0" max="2" step="0.05" value="1" />
            <output id="feed-saturation-out">1.00</output>
        </label>
        <label>Hue rotate
            <input type="range" id="feed-hue" min="-180" max="180" step="1" value="0" />
            <output id="feed-hue-out">0°</output>
        </label>
        <label>Blur
            <input type="range" id="feed-blur" min="0" max="8" step="0.5" value="0" />
            <output id="feed-blur-out">0px</output>
        </label>

        <label class="check">
            <input type="checkbox" id="feed-flip-h" />
            Flip horizontal
        </label>
        <label class="check">
            <input type="checkbox" id="feed-flip-v" />
            Flip vertical
        </label>
      </fieldset>

      <fieldset class="task" data-task="pose">
        <legend>Pose</legend>
        <label>Landmark colour
          <input type="color" id="pose-landmark-color" value="#00ffff" />
        </label>
        <label>Connector colour
          <input type="color" id="pose-connector-color" value="#00ffff" />
        </label>
        <label>Line width
          <input type="range" id="pose-line-width" min="1" max="10" step="0.5" value="2" />
          <output id="pose-line-width-out">2</output>
        </label>
        <label>Landmark radius
          <input type="range" id="pose-radius" min="1" max="12" step="0.5" value="4" />
          <output id="pose-radius-out">4</output>
        </label>
        <label class="check">
          <input type="checkbox" id="pose-indices" />
          Show indices
        </label>
      </fieldset>

      <fieldset class="task" data-task="hand">
        <legend>Hands</legend>
        <label>Landmark colour
          <input type="color" id="hand-landmark-color" value="#00ff00" />
        </label>
        <label>Connector colour
          <input type="color" id="hand-connector-color" value="#00ff00" />
        </label>
        <label>Line width
          <input type="range" id="hand-line-width" min="1" max="10" step="0.5" value="2" />
          <output id="hand-line-width-out">2</output>
        </label>
        <label>Landmark radius
          <input type="range" id="hand-radius" min="1" max="12" step="0.5" value="4" />
          <output id="hand-radius-out">4</output>
        </label>
        <label class="check">
          <input type="checkbox" id="hand-indices" />
          Show indices
        </label>
      </fieldset>

    </aside>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
